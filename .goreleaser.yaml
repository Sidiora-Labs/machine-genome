version: 2

project_name: machine-genome

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: mgs
    main: ./cmd/mgs
    binary: mgs
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-buildvcs=false
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.buildVersion={{.Version}}
        -X main.buildCommit={{.FullCommit}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE
      - SECURITY.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  disable: true

release:
  draft: true
