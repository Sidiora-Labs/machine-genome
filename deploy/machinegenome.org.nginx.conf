limit_req_zone $binary_remote_addr zone=machine_genome_per_ip:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name machinegenome.org www.machinegenome.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://machinegenome.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.machinegenome.org;

    ssl_certificate /etc/letsencrypt/live/machinegenome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/machinegenome.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://machinegenome.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name machinegenome.org;

    ssl_certificate /etc/letsencrypt/live/machinegenome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/machinegenome.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1100k;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        limit_req zone=machine_genome_per_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
